<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simplified Startup — AI Advisor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;display:flex;align-items:center;justify-content:center;min-height:100vh}
.widget{width:420px;height:700px;background:#fff;border-radius:20px;box-shadow:0 8px 48px rgba(0,0,0,.12);display:flex;flex-direction:column;overflow:hidden}
.header{padding:18px 20px 16px;border-bottom:1px solid #efefed;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;background:#1a1a1a;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo svg{width:18px;height:18px;fill:#fff}
.header-text h2{font-size:15px;font-weight:600;color:#1a1a1a;line-height:1.2}
.header-text p{font-size:12px;color:#888;margin-top:2px}
.reset-btn{margin-left:auto;background:none;border:none;cursor:pointer;color:#bbb;padding:4px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.reset-btn:hover{color:#888;background:#f5f5f5}
.disclosure{background:#fafaf8;border-bottom:1px solid #efefed;padding:8px 20px;display:flex;gap:14px;flex-wrap:wrap}
.disclosure span{font-size:10.5px;color:#aaa;display:flex;align-items:center;gap:4px}
.disclosure span::before{content:'·';color:#ccc}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:3px}
.messages::-webkit-scrollbar-thumb{background:#e0e0e0;border-radius:3px}
.msg-bot{align-self:flex-start;max-width:88%}
.msg-user{align-self:flex-end;max-width:82%}
.bubble-bot{background:#f5f4f0;color:#1a1a1a;padding:11px 14px;border-radius:4px 16px 16px 16px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.bubble-user{background:#1a1a1a;color:#fff;padding:11px 14px;border-radius:16px 16px 4px 16px;font-size:14px;line-height:1.55}
.typing{align-self:flex-start;background:#f5f4f0;padding:12px 16px;border-radius:4px 16px 16px 16px;display:flex;gap:5px;align-items:center}
.typing span{width:6px;height:6px;border-radius:50%;background:#bbb;animation:bounce 1.1s infinite}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px);background:#888}}
.quick-replies{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.qr-btn{background:#fff;border:1px solid #e8e8e4;color:#333;padding:9px 14px;border-radius:10px;font-size:13px;text-align:left;cursor:pointer;transition:all .15s;line-height:1.4}
.qr-btn:hover{background:#f5f4f0;border-color:#ccc}
.cta-card{background:#1a1a1a;color:#fff;padding:14px 16px;border-radius:12px;margin-top:4px}
.cta-card p{font-size:13px;line-height:1.5;margin-bottom:10px;color:#ccc}
.cta-btn{display:block;background:#fff;color:#1a1a1a;text-decoration:none;text-align:center;padding:10px;border-radius:8px;font-size:13px;font-weight:600;transition:opacity .15s}
.cta-btn:hover{opacity:.85}
.input-area{padding:14px 16px;border-top:1px solid #efefed;display:flex;gap:10px;align-items:center}
.input-area input{flex:1;background:#f5f4f0;border:none;border-radius:10px;padding:10px 14px;font-size:14px;color:#1a1a1a;outline:none}
.input-area input::placeholder{color:#aaa}
.send-btn{background:#1a1a1a;border:none;border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:opacity .15s}
.send-btn:hover{opacity:.8}
.send-btn:disabled{opacity:.3;cursor:not-allowed}
.send-btn svg{width:16px;height:16px;fill:#fff}
.footer{padding:8px 20px 12px;text-align:center}
.footer p{font-size:11px;color:#bbb;line-height:1.4}
.footer a{color:#bbb}
</style>
</head>
<body>
<div class="widget">
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div class="header-text">
      <h2>Simplified Startup</h2>
      <p>AI Advisor · directional advice, instantly</p>
    </div>
    <button class="reset-btn" onclick="resetChat()" title="Start over">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>
  <div class="disclosure">
    <span>Automated assistant</span>
    <span>Conversations may be reviewed</span>
    <span>General guidance only</span>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <input type="text" id="msgInput" placeholder="Type what's going on..." disabled />
    <button class="send-btn" id="sendBtn" disabled onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
  <div class="footer"><p>Answers come from Simplified Startup's published information.<br>Nothing here is a quote. <a href="https://simplified-startup-ui.vercel.app" target="_blank">simplifiedstartup.com</a></p></div>
</div>

<script>
const BASE = 'https://web-production-c4d14.up.railway.app';
let sid = null;
let chipRow = null;   // the currently shown row of tappable options, if any

const msgs = document.getElementById('messages');
const input = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

const OPENING_CHIPS = [
  "I have an idea but have no idea where to begin",
  "We get traffic but almost none of it converts",
  "Our marketing is running but not bringing in leads",
  "I need to launch something in the next few months",
  "There are repetitive tasks I want to automate",
  "I honestly don't know what to tackle first",
];

function addBot(text, showCTA) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-bot';
  const bubble = document.createElement('div');
  bubble.className = 'bubble-bot';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  if (showCTA) {
    const card = document.createElement('div');
    card.className = 'cta-card';
    card.innerHTML = `<p>Book a free 30-minute strategy call — you'll leave with a written plan either way.</p><a class="cta-btn" href="https://simplified-startup-ui.vercel.app/#book" target="_blank" onclick="track('cta_clicked', {location: 'chat'})">Book a free strategy call →</a>`;
    wrap.appendChild(card);
  }
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}

function addUser(text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-user';
  wrap.innerHTML = `<div class="bubble-user"></div>`;
  wrap.querySelector('.bubble-user').textContent = text;
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const t = document.createElement('div');
  t.className = 'typing'; t.id = 'typing';
  t.innerHTML = '<span></span><span></span><span></span>';
  msgs.appendChild(t); msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

// Remove any lingering option row (on tap, or when the user types their own answer).
function clearChips() {
  if (chipRow) { chipRow.remove(); chipRow = null; }
}

// Render tappable answer options under the last bot message.
// Always appends a "Something else" escape that opens the text box instead of sending.
function showChips(chips) {
  clearChips();
  if (!Array.isArray(chips) || !chips.length) return;
  const wrap = document.createElement('div');
  wrap.className = 'msg-bot';
  const row = document.createElement('div');
  row.className = 'quick-replies';
  chips.slice(0, 6).forEach(text => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = text;
    btn.onclick = () => { clearChips(); handleSend(text); };
    row.appendChild(btn);
  });
  // "Something else" escape — clears chips and focuses the input so they can type freely.
  const escape = document.createElement('button');
  escape.className = 'qr-btn';
  escape.textContent = 'Something else — let me type it';
  escape.style.opacity = '0.6';
  escape.style.fontStyle = 'italic';
  escape.onclick = () => { clearChips(); input.focus(); };
  row.appendChild(escape);
  wrap.appendChild(row);
  msgs.appendChild(wrap);
  chipRow = wrap;
  msgs.scrollTop = msgs.scrollHeight;
}

function setInput(enabled) {
  input.disabled = !enabled;
  sendBtn.disabled = !enabled;
  if (enabled) input.focus();
}

function track(event, props) {
  try { if (window.posthog) posthog.capture(event, props || {}); } catch(e) {}
}

async function start() {
  showTyping();
  try {
    const res = await fetch(BASE + '/conversation/start', { method: 'POST' });
    const data = await res.json();
    sid = data.session_id;
    removeTyping();
    addBot(data.message);
    track('chat_opened', { page: location.pathname });
    showChips(OPENING_CHIPS);
    setInput(true);
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !sendBtn.disabled) sendMessage(); });
  } catch(e) {
    removeTyping();
    addBot('Having trouble connecting. Please try again in a moment.');
  }
}

async function handleSend(text) {
  if (!text.trim() || !sid) return;
  clearChips();  // chips clear only when a message is actually sent
  input.value = '';
  setInput(false);
  addUser(text);
  showTyping();
  try {
    const res = await fetch(BASE + '/conversation/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sid, message: text })
    });
    const data = await res.json();
    removeTyping();
    const hasCTA = data.message.toLowerCase().includes('/#book') || data.message.toLowerCase().includes('strategy call');
    const cleanMsg = data.message.replace(/https?:\/\/simplified-startup-ui\.vercel\.app\/#book/g, '').replace(/simplified-startup-ui\.vercel\.app\/#book/g, '').trim();
    addBot(cleanMsg, hasCTA);
    showChips(data.chips);
  } catch(e) {
    removeTyping();
    addBot("Something went wrong. Please try again.");
  }
  setInput(true);
}

function sendMessage() {
  handleSend(input.value.trim());
}

function resetChat() {
  clearChips();
  msgs.innerHTML = '';
  sid = null;
  setInput(false);
  start();
}

start();
</script>
</body>
</html>
